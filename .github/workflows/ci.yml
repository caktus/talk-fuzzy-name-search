# CI for talk-fuzzy-name-search (RECS-2026-08-14 P2-18).
#
# Runs the full test suite plus a small-seed smoke test (10K rows, NOT the
# 54M live dataset) against a PostgreSQL 18 service container. Postgres 18 is
# the major version the project is verified against (live server: 18.4); the
# official `postgres:18` tag tracks the latest 18.x. The image ships the
# fuzzystrmatch and pg_trgm contrib modules, and the service user `postgres`
# is a superuser, so the app's `CREATE EXTENSION` migrations succeed.
#
# The full pre-commit suite runs over all files (uv-lock, missing-migrations,
# ruff check+format, prettier, djlint, django-upgrade, and the standard
# pre-commit-hooks checks) as the single lint/gate step. The missing-migrations
# hook is a `language: system` hook that shells to `uv run manage.py
# makemigrations --check`; it uses the synced venv (from the Install step) and
# the job-level DATABASE_URL to import settings. `makemigrations --check` only
# diffs models against migrations on disk and never opens a DB connection, so
# it is not sensitive to Postgres service readiness.

name: CI

on:
  push:
    branches: [main, fix/legacy-sort-timeout]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fuzzy_demo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Minimal real env for the settings (fuzzy_demo/settings.py):
      # DATABASE_URL (env.db default is a no-password local dev URL),
      # DEBUG (defaults to True), DJANGO_SECRET_KEY (has an insecure
      # default; set explicitly for CI).
      DATABASE_URL: psql://postgres:postgres@localhost:5432/fuzzy_demo
      DEBUG: "False"
      DJANGO_SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Persists the uv package cache to the GitHub Actions cache. The cache
      # key is derived automatically from the OS, Python version and the
      # contents of the files matching cache-dependency-glob (uv.lock /
      # pyproject.toml by default), so it invalidates exactly when
      # dependencies change. prune-cache drops pre-built wheels before
      # saving (they are re-fetched from PyPI, which is faster than the
      # extra upload/download traffic).
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          prune-cache: true

      # pre-commit clones each hook repo into this cache dir; cache it
      # keyed on the hook config so it only invalidates when hook repos
      # or versions (revs) change.
      - name: Cache pre-commit
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      # --frozen fails if uv.lock is out of sync with pyproject.toml;
      # --all-groups installs the dev group (pytest, ruff, pre-commit, ...) --
      # in CI environments uv sync excludes dev groups unless requested.
      - name: Install dependencies
        run: uv sync --frozen --all-groups

      # Full pre-commit gate over all files (see header note). Runs the
      # missing-migrations system hook (needs the venv + job DATABASE_URL)
      # plus every other hook: uv-lock, ruff, prettier, djlint, django-upgrade,
      # and the pre-commit-hooks checks.
      - name: Pre-commit
        run: uv run pre-commit run --all-files

      # pytest-django creates its own test database (test_fuzzy_demo) from
      # scratch, proving the full 0001-0004 migration chain including
      # CREATE EXTENSION fuzzystrmatch/pg_trgm, then runs the whole suite.
      # The suite needs NO external data: the full-pipeline seed_data tests
      # substitute small synthetic name-frequency CSVs.
      - name: Run test suite
        run: uv run pytest tests/ -q

      # The name-frequency CSVs (us_forenames.csv / us_surnames.csv) are
      # gitignored local artifacts, so regenerate them from the Kaggle source
      # dataset the same way the README tells local devs (kagglehub is in the
      # dev group, already synced). Run from name_dataset/ so the CSVs land
      # where seed_data expects them. Only the seed smoke below needs them.
      # kagglehub.dataset_download caches the source dataset in
      # ~/.cache/kagglehub (its default cache dir) and serves it from there
      # on subsequent calls, so on a cache hit this step skips the network
      # download and only re-runs the polars filter step.
      - name: Cache kagglehub dataset
        uses: actions/cache@v5
        with:
          path: ~/.cache/kagglehub
          key: kagglehub-${{ runner.os }}-${{ hashFiles('name_dataset/download_name_data.py') }}
          restore-keys: |
            kagglehub-${{ runner.os }}-

      - name: Generate name-frequency data
        run: |
          cd name_dataset
          uv run python download_name_data.py

      # Small-seed smoke (RECS P2-18): seed 10K rows in a SCRATCH database
      # -- never the fuzzy_demo service DB, never anything close to 54M.
      # migrate first: seed_data assumes the schema (and extensions) exist.
      - name: Seed smoke (10K rows in scratch DB)
        env:
          PGPASSWORD: postgres
          DATABASE_URL: psql://postgres:postgres@localhost:5432/ci_seed_smoke
        run: |
          set -euo pipefail
          dropdb --if-exists -h localhost -U postgres ci_seed_smoke
          createdb -h localhost -U postgres ci_seed_smoke
          uv run python manage.py migrate
          uv run python manage.py seed_data --count 10000 --seed 42 --as-of 2026-01-01
          # seed_data trims to the exact --count target on an empty table,
          # so the count is deterministic.
          uv run python manage.py shell -c "from records.models import CourtRecord; n = CourtRecord.objects.count(); print(f'record_count={n}'); assert n == 10000, f'expected 10000 rows, got {n}'"
          dropdb -h localhost -U postgres ci_seed_smoke
