[defaults]
roles_path = roles/
collections_path = collections/
inventory = inventory
pipelining = True
interpreter_python = auto_silent
callbacks_enabled = ansible.posix.profile_tasks

[ssh_connection]
# Verify the droplet's host key against known_hosts (run `ssh-keyscan` to
# enroll a new droplet's key before the first connection) and don't forward
# the controller's SSH agent to the remote root account.
ssh_args = -o StrictHostKeyChecking=yes
