---
# Load the deploy env file (generated by the 'secrets' tag on first run)
# into the deploy_env variable. Imported by plays that run as a non-root
# user and need the generated secrets.
- name: Check for deploy env file
  ansible.builtin.stat:
    path: "{{ deploy_env_file }}"
  register: deploy_env_stat

- name: Fail with instructions if the deploy env file is missing
  ansible.builtin.fail:
    msg: >-
      {{ deploy_env_file }} not found. Run the 'secrets' tag first:
      ansible-playbook setup.yaml -t secrets
  when: not deploy_env_stat.stat.exists

- name: Slurp deploy env file
  ansible.builtin.slurp:
    src: "{{ deploy_env_file }}"
  register: deploy_env_raw

- name: Parse deploy env file into deploy_env
  ansible.builtin.set_fact:
    # Must be a single-line template: folding a multi-line Jinja expression
    # across a block scalar silently yields an empty dict.
    deploy_env: "{{ dict(deploy_env_raw.content | b64decode | split('\n') | select('match', '^[A-Z][A-Z0-9_]*=') | map('split', '=', 1)) }}"
