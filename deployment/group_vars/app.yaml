---
### App group configuration ###

### caktus.podman_containers configuration ###

podman_user: django_user
podman_user_home: /home/django_user

podman_use_quadlets: yes

# Single shared network (no pods needed for a single container)
podman_default_network: app
podman_networks:
  - name: "{{ podman_default_network }}"

# Workaround supporting Podman 4.9.x logging; auto-start on boot:
podman_quadlet_options:
  - PodmanArgs=--log-driver=k8s-file --log-opt path={{ podman_user_home }}/log/{{ item.name }}.log
  - "\n[Install]\nWantedBy=default.target"

### Image build (no registry: build from git on the droplet) ###
podman_build_repos:
  # Private repo: the 'secrets' tag generates a GitHub deploy key pair and
  # the 'app' tag installs the private key for django_user.
  # Add the matching public key to the repo (Settings -> Deploy keys, read-only).
  - repo: git@github.com:caktus/talk-fuzzy-name-search.git
    version: "{{ git_branch }}"
    dest_dir: "{{ podman_user_home }}/src/talk-fuzzy-name-search"
    image_name: localhost/talk-fuzzy-name-search

### Container environment (mirrors recordsdb's podman_env_vars) ###
# Secret values come from the deploy.env file generated by the 'secrets'
# tag on first run (see setup.yaml); they are loaded into deploy_env.
podman_env_vars:
  DJANGO_MANAGEPY_MIGRATE: "on"
  DEBUG: "False"
  DJANGO_SECRET_KEY: "{{ deploy_env['DJANGO_SECRET_KEY'] }}"
  DJANGO_ALLOWED_HOSTS: "{{ env_allowed_hosts | join(',') }}"
  CSRF_TRUSTED_ORIGINS: "https://{{ env_allowed_hosts | first }}"
  # Reach the host's PostgreSQL through the dedicated loopback alias IP.
  DATABASE_URL: "postgres://{{ database_user }}:{{ deploy_env['DATABASE_PASSWORD'] }}@{{ database_host_ip }}/{{ database_name }}"

podman_containers:
  # Entrypoint (docker-entrypoint.sh) runs migrations, then gunicorn.
  - name: gunicorn
    image: localhost/talk-fuzzy-name-search
    tag: latest
    env_as_file: "{{ podman_env_vars }}"
    publish:
      # Caddy on the host proxies to this loopback-only port.
      - "127.0.0.1:{{ app_port }}:{{ app_port }}"
