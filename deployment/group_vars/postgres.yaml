---
### PostgreSQL configuration (mirrors recordsdb, adapted for a single DO droplet) ###

### geerlingguy.postgresql configuration ###

# Install newer postgres from the PGDG repo
postgresql_version: 18

# Required to be set when changing postgresql_version from default:
postgresql_bin_path: "/usr/lib/postgresql/{{ postgresql_version }}/bin"
postgresql_config_path: "/etc/postgresql/{{ postgresql_version }}/main"
# Keep the existing cluster (with production data) in its standard location.
postgresql_data_dir: "/var/lib/postgresql/{{ postgresql_version }}/main"
postgresql_packages:
  - postgresql-{{ postgresql_version }}
  - postgresql-contrib-{{ postgresql_version }}
  - libpq-dev

postgresql_user: postgres
postgresql_group: postgres
postgresql_unix_socket_directories:
  - /var/run/postgresql
postgresql_auth_method: scram-sha-256

# pg_hba.conf entries
postgresql_hba_entries:
  - { type: local, database: all, user: postgres, auth_method: peer }
  - { type: local, database: all, user: all, auth_method: peer }
  - {
      type: host,
      database: all,
      user: all,
      address: "127.0.0.1/32",
      auth_method: "{{ postgresql_auth_method }}",
    }
  - {
      type: host,
      database: all,
      user: all,
      address: "::1/128",
      auth_method: "{{ postgresql_auth_method }}",
    }
  # Allow connections from the loopback alias IP used by podman containers
  - {
      type: host,
      database: all,
      user: all,
      address: "{{ database_host_ip }}/32",
      auth_method: "{{ postgresql_auth_method }}",
    }

# Global config options (8 GB RAM / 4 vCPU droplet, 40 connections)
# Generated by pgtune:
# https://pgtune.leopard.in.ua/?dbVersion=18&osType=linux&dbType=web&cpuNum=4&totalMemory=8&totalMemoryUnit=GB&connectionNum=40&hdType=ssd&dbSize=mid_ram
postgresql_global_config_options:
  - option: unix_socket_directories
    value: '{{ postgresql_unix_socket_directories | join(",") }}'
  - option: log_directory
    value: "log"
  # Listen on loopback and the container-facing alias IP only
  - option: listen_addresses
    value: "127.0.0.1,{{ database_host_ip }}"
  - option: max_connections
    value: "40"
  - option: shared_buffers
    value: "2GB"
  - option: effective_cache_size
    value: "6GB"
  - option: maintenance_work_mem
    value: "512MB"
  - option: checkpoint_completion_target
    value: "0.9"
  - option: wal_buffers
    value: "16MB"
  - option: default_statistics_target
    value: "100"
  - option: random_page_cost
    value: "1.1"
  - option: effective_io_concurrency
    value: "200"
  - option: work_mem
    value: "47662kB"
  - option: huge_pages
    value: "try"
  # Disable JIT — not worth the overhead for this workload (pgtune)
  - option: jit
    value: "off"
  # Compress WAL records to save IO on the SSD (pgtune)
  - option: wal_compression
    value: "lz4"
  # Use io_uring for async WAL reads where supported (pgtune)
  - option: io_method
    value: "io_uring"
  - option: min_wal_size
    value: "1GB"
  - option: max_wal_size
    value: "4GB"
  - option: max_worker_processes
    value: "4"
  - option: max_parallel_workers_per_gather
    value: "2"
  - option: max_parallel_workers
    value: "4"
  - option: max_parallel_maintenance_workers
    value: "2"
  # Log slow queries
  - option: log_min_duration_statement
    value: "500"

### galaxyproject.postgresql_objects configuration ###

# The user and database already exist on this droplet (created by the
# pre-ansible deployment); these entries are idempotent and ensure the
# password matches the generated deploy.env secrets.
postgresql_objects_users:
  - name: "{{ database_user }}"
    password: "{{ deploy_env['DATABASE_PASSWORD'] }}"
    state: present

postgresql_objects_databases:
  - name: "{{ database_name }}"
    owner: "{{ database_user }}"
    state: present
