<!DOCTYPE html>
<html lang="en" class="h-full">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
              content="PostgreSQL + Django strategies for fuzzy name matching at scale">
        <meta name="keywords"
              content="fuzzy search, PostgreSQL, Django, name matching">
        <title>Fuzzy Name Search at Scale</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://unpkg.com/htmx.org@2.0.8"></script>
        <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe',
                            300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6',
                            600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a',
                        },
                    },
                },
            },
        }
        </script>
        <style>
        .dtbl { @apply w-full text-xs text-left text-gray-500; }
        .dtbl thead { @apply text-xs text-gray-700 uppercase bg-gray-100; }
        .dtbl th { @apply px-4 py-3 whitespace-nowrap; }
        .dtbl tbody tr { @apply bg-white border-b hover:bg-gray-50; }
        .dtbl td { @apply px-4 py-3; }
        .dtbl td.nw { @apply whitespace-nowrap; }
        .dtbl td.pk { @apply font-medium text-gray-900 whitespace-nowrap; }
        .htmx-request .search-btn { @apply opacity-50 cursor-wait; }
        </style>
    </head>
    <body class="h-full bg-gray-50">
        <div class="min-h-full">
            <header class="bg-white shadow-sm border-b border-gray-200">
                <div class="mx-auto max-w-7xl px-4 py-4 sm:px-6 lg:px-8">
                    <div class="flex items-center justify-between">
                        <div>
                            <h1 class="text-xl font-semibold text-gray-900">Fuzzy Name Search at Scale</h1>
                            <p class="text-sm text-gray-500 mt-1">PostgreSQL + Django strategies for fuzzy name matching</p>
                        </div>
                        <span class="inline-flex items-center rounded-full bg-green-50 px-2 py-1 text-xs font-medium text-green-700 ring-1 ring-inset ring-green-600/20">
                            {{ total_records|default:"0" }} records
                        </span>
                    </div>
                </div>
            </header>
            <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
                    <form id="search-form"
                          method="get"
                          hx-get="{% url 'records:search' %}"
                          hx-trigger="run-search, input changed delay:250ms from:#first_name, input changed delay:250ms from:#last_name"
                          hx-target="#search-results"
                          hx-swap="innerHTML"
                          hx-push-url="true">
                        <input type="hidden"
                               id="mode"
                               name="mode"
                               value="{{ mode|default:'phonetic' }}">
                        <nav class="flex flex-wrap gap-1 border-b border-gray-200 mb-5"
                             role="tablist"
                             aria-label="Search mechanism">
                            {% for key, m in modes.items %}
                                <button type="button"
                                        data-mode="{{ key }}"
                                        role="tab"
                                        aria-selected="{% if key == mode %}true{% else %}false{% endif %}"
                                        title="{{ m.description }}"
                                        class="tab-btn -mb-px border-b-2 px-4 py-2 text-sm font-medium transition-colors {% if key == mode %}border-primary-600 text-primary-700{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700{% endif %}">
                                    {{ m.label }}
                                </button>
                            {% endfor %}
                        </nav>
                        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
                            <div>
                                <label for="first_name" class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                                <input type="text"
                                       id="first_name"
                                       name="first_name"
                                       value="{{ first_name|default:'' }}"
                                       placeholder="e.g., John, Jonh, Bill"
                                       class="block w-full rounded-md border-0 py-2 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-600 sm:text-sm sm:leading-6">
                            </div>
                            <div>
                                <label for="last_name" class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                                <input type="text"
                                       id="last_name"
                                       name="last_name"
                                       value="{{ last_name|default:'' }}"
                                       placeholder="e.g., Smith, Smyth"
                                       class="block w-full rounded-md border-0 py-2 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-600 sm:text-sm sm:leading-6">
                            </div>
                            <div class="flex items-end gap-2">
                                <button type="submit"
                                        class="search-btn inline-flex items-center rounded-md bg-primary-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-primary-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">
                                    Search
                                </button>
                                <div class="htmx-indicator">
                                    <svg class="animate-spin h-5 w-5 text-primary-600"
                                         xmlns="http://www.w3.org/2000/svg"
                                         fill="none"
                                         viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                        </path>
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div id="search-results">{% include "records/_search_results.html" %}</div>
            </main>
        </div>
        <script>
        document.addEventListener("click", function (e) {
            const btn = e.target.closest(".tab-btn");
            if (!btn) return;
            document.getElementById("mode").value = btn.dataset.mode;
            document.querySelectorAll(".tab-btn").forEach(function (b) {
                const active = b === btn;
                b.setAttribute("aria-selected", active ? "true" : "false");
                b.classList.toggle("border-primary-600", active);
                b.classList.toggle("text-primary-700", active);
                b.classList.toggle("border-transparent", !active);
                b.classList.toggle("text-gray-500", !active);
            });
            htmx.trigger("#search-form", "run-search");
        });
        </script>
    </body>
</html>
