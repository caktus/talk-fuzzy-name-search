<!DOCTYPE html>
<html lang="en" class="h-full">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fuzzy Name Search at Scale</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://unpkg.com/htmx.org@2.0.8"></script>
        <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe',
                            300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6',
                            600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a',
                        },
                    },
                },
            },
        }
        </script>
        <style>
        .htmx-request .search-btn { @apply opacity-50 cursor-wait; }
        </style>
    </head>
    <body class="h-full bg-gray-50">
        <div class="min-h-full">
            <header class="bg-white shadow-sm border-b border-gray-200">
                <div class="mx-auto max-w-7xl px-4 py-4 sm:px-6 lg:px-8">
                    <div class="flex items-center justify-between">
                        <div>
                            <h1 class="text-xl font-semibold text-gray-900">Fuzzy Name Search at Scale</h1>
                            <p class="text-sm text-gray-500 mt-1">
                                PostgreSQL + Django strategies for fuzzy name matching
                                <a href="{% url 'records:help' %}" class="text-primary-600 hover:text-primary-500 ml-1">How it works</a>
                            </p>
                        </div>
                        <span class="inline-flex items-center rounded-full bg-green-50 px-2 py-1 text-xs font-medium text-green-700 ring-1 ring-inset ring-green-600/20">
                            {{ total_records|default:"0" }} records
                        </span>
                    </div>
                </div>
            </header>
            <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
                    <form id="search-form"
                          method="get"
                          hx-get="{% url 'records:search' %}"
                          hx-trigger="run-search, input changed delay:250ms from:#first_name, input changed delay:250ms from:#last_name, change delay:250ms from:#date_of_birth"
                          hx-target="#search-results"
                          hx-swap="innerHTML"
                          hx-push-url="true">
                        <input type="hidden" id="modes" name="modes" value="">

                        <div class="space-y-3 mb-4 pb-4 border-b border-gray-200">
                            <!-- Exact -->
                            <div class="flex items-start gap-3">
                                <span class="text-xs font-semibold text-green-700 uppercase tracking-wide mt-0.5 shrink-0 w-16">Exact</span>
                                <div class="flex flex-wrap gap-x-4 gap-y-1">
                                    <label class="inline-flex items-center gap-1.5 text-sm cursor-pointer group">
                                        <input type="checkbox" class="mode-checkbox rounded border-gray-300 text-green-600 shadow-sm focus:ring-green-600" value="prefix" {% if "prefix" in enabled_modes %}checked{% endif %}>
                                        <span class="text-gray-700 group-hover:text-gray-900">{{ modes.prefix.label }}</span>
                                        {% if mode_sql.prefix %}<span class="text-gray-400 cursor-help text-xs" title="{{ mode_sql.prefix|safe }}">(i)</span>{% endif %}
                                    </label>
                                    <label class="inline-flex items-center gap-1.5 text-sm cursor-pointer group">
                                        <input type="checkbox" class="mode-checkbox rounded border-gray-300 text-green-600 shadow-sm focus:ring-green-600" value="legacy" {% if "legacy" in enabled_modes %}checked{% endif %}>
                                        <span class="text-gray-700 group-hover:text-gray-900">{{ modes.legacy.label }}</span>
                                        {% if mode_sql.legacy %}<span class="text-gray-400 cursor-help text-xs" title="{{ mode_sql.legacy|safe }}">(i)</span>{% endif %}
                                    </label>
                                </div>
                            </div>
                            <!-- Phonetic -->
                            <div class="flex items-start gap-3">
                                <span class="text-xs font-semibold text-blue-700 uppercase tracking-wide mt-0.5 shrink-0 w-16">Phonetic</span>
                                <div class="flex flex-wrap gap-x-4 gap-y-1">
                                    <label class="inline-flex items-center gap-1.5 text-sm cursor-pointer group">
                                        <input type="checkbox" class="mode-checkbox rounded border-gray-300 text-blue-600 shadow-sm focus:ring-blue-600" value="soundex" {% if "soundex" in enabled_modes %}checked{% endif %}>
                                        <span class="text-gray-700 group-hover:text-gray-900">{{ modes.soundex.label }}</span>
                                        {% if mode_sql.soundex %}<span class="text-gray-400 cursor-help text-xs" title="Phonetic code equality.\nSoundex: {{ first_name }}={{ phonetic_codes.soundex_fn }}, {{ last_name }}={{ phonetic_codes.soundex_ln }}\n{{ mode_sql.soundex|safe }}">(i)</span>{% endif %}
                                    </label>
                                    <label class="inline-flex items-center gap-1.5 text-sm cursor-pointer group">
                                        <input type="checkbox" class="mode-checkbox rounded border-gray-300 text-blue-600 shadow-sm focus:ring-blue-600" value="dm" {% if "dm" in enabled_modes %}checked{% endif %}>
                                        <span class="text-gray-700 group-hover:text-gray-900">{{ modes.dm.label }}</span>
                                        {% if mode_sql.dm %}<span class="text-gray-400 cursor-help text-xs" title="Phonetic codes for Slavic/Germanic names.\nDM: {{ first_name }}={{ phonetic_codes.dm_fn }}, {{ last_name }}={{ phonetic_codes.dm_ln }}\n{{ mode_sql.dm|safe }}">(i)</span>{% endif %}
                                    </label>
                                </div>
                            </div>
                            <!-- Fuzzy -->
                            <div class="flex items-start gap-3">
                                <span class="text-xs font-semibold text-amber-700 uppercase tracking-wide mt-0.5 shrink-0 w-16">Fuzzy</span>
                                <div class="flex flex-wrap gap-x-4 gap-y-1">
                                    <label class="inline-flex items-center gap-1.5 text-sm cursor-pointer group">
                                        <input type="checkbox" class="mode-checkbox rounded border-gray-300 text-amber-600 shadow-sm focus:ring-amber-600" value="levenshtein" {% if "levenshtein" in enabled_modes %}checked{% endif %}>
                                        <span class="text-gray-700 group-hover:text-gray-900">{{ modes.levenshtein.label }}</span>
                                        {% if mode_sql.levenshtein %}<span class="text-gray-400 cursor-help text-xs" title="{{ mode_sql.levenshtein|safe }}">(i)</span>{% endif %}
                                    </label>
                                    <label class="inline-flex items-center gap-1.5 text-sm cursor-pointer group">
                                        <input type="checkbox" class="mode-checkbox rounded border-gray-300 text-amber-600 shadow-sm focus:ring-amber-600" value="trigram" {% if "trigram" in enabled_modes %}checked{% endif %}>
                                        <span class="text-gray-700 group-hover:text-gray-900">{{ modes.trigram.label }}</span>
                                        {% if mode_sql.trigram %}<span class="text-gray-400 cursor-help text-xs" title="{{ mode_sql.trigram|safe }}">(i)</span>{% endif %}
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
                            <div>
                                <label for="first_name" class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                                <input type="text" id="first_name" name="first_name"
                                       value="{{ first_name|default:'' }}"
                                       placeholder="e.g., John, Jonh, Bill"
                                       class="block w-full rounded-md border-0 py-2 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-600 sm:text-sm sm:leading-6">
                            </div>
                            <div>
                                <label for="last_name" class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                                <input type="text" id="last_name" name="last_name"
                                       value="{{ last_name|default:'' }}"
                                       placeholder="e.g., Smith, Smyth"
                                       class="block w-full rounded-md border-0 py-2 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-600 sm:text-sm sm:leading-6">
                            </div>
                            <div>
                                <div class="flex items-center justify-between mb-1">
                                    <label for="date_of_birth" class="block text-sm font-medium text-gray-700">Date of Birth</label>
                                    <button type="button" id="dob-clear-btn" class="dob-clear-link text-xs font-medium text-primary-700 hover:underline hidden">Clear</button>
                                </div>
                                <input type="date" id="date_of_birth" name="date_of_birth"
                                       value="{{ date_of_birth|date:'Y-m-d'|default:'' }}"
                                       class="block w-full rounded-md border-0 py-2 px-3 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-600 sm:text-sm sm:leading-6">
                            </div>
                            <div class="flex items-end gap-2">
                                <button type="submit"
                                        class="search-btn inline-flex items-center rounded-md bg-primary-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-primary-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600">
                                    Search
                                </button>
                                <div class="htmx-indicator">
                                    <svg class="animate-spin h-5 w-5 text-primary-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div id="search-results">{% include "records/_search_results.html" %}</div>
            </main>
        </div>
        <script>
        function updateModes() {
            var checkboxes = document.querySelectorAll('.mode-checkbox');
            var enabled = [];
            checkboxes.forEach(function(cb) {
                if (cb.checked) enabled.push(cb.value);
            });
            document.getElementById('modes').value = enabled.join(',');
        }
        document.addEventListener("change", function (e) {
            if (e.target.classList.contains('mode-checkbox')) {
                updateModes();
                htmx.trigger("#search-form", "run-search");
            }
        });
        document.addEventListener("click", function (e) {
            if (e.target.closest(".dob-clear-link")) {
                document.getElementById("date_of_birth").value = "";
                updateDobClear();
                htmx.trigger("#search-form", "run-search");
                return;
            }
            var dobLink = e.target.closest(".dob-link");
            if (dobLink) {
                document.getElementById("date_of_birth").value = dobLink.dataset.dob;
                updateDobClear();
                htmx.trigger("#search-form", "run-search");
            }
        });
        function updateDobClear() {
            var dob = document.getElementById('date_of_birth').value;
            var clearBtn = document.querySelector('.dob-clear-link');
            if (dob && !clearBtn) {
                var label = document.querySelector('label[for="date_of_birth"]').parentElement;
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'dob-clear-link text-xs font-medium text-primary-700 hover:underline';
                btn.textContent = 'Clear';
                label.appendChild(btn);
            } else if (!dob && clearBtn) {
                clearBtn.remove();
            }
        }
        document.getElementById('date_of_birth').addEventListener('change', updateDobClear);
        updateModes();
        updateDobClear();
        </script>
    </body>
</html>
