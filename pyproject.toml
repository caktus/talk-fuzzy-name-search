[project]
name = "talk-fuzzy-name-search"
version = "0.1.0"
description = "Demo: PostgreSQL + Django fuzzy name matching at scale"
requires-python = ">=3.14"
dependencies = [
    "django~=5.2",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "faker>=30",
    "marimo>=0.10",
    "numpy>=2.0",
    "polars>=1.0",
    "django-simple-deploy>=1.4.1",
    "gunicorn>=23.0.0",
    "whitenoise>=6.7.0",
    # Only used by the marimo slides.py SQL cells (SQLAlchemy defaults to the psycopg2 driver for postgresql:// URLs); the app's DB driver is psycopg3.
    "sqlalchemy>=2.0.52",
    "psycopg2>=2.9.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.9",
    "pre-commit>=4",
    "django-debug-toolbar>=7.0.0",
    "kagglehub>=1.0.2",
]

[tool.django]
# For pytest-django auto-discovery
DJANGO_SETTINGS_MODULE = "fuzzy_demo.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fuzzy_demo.settings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120
# Marimo rewrites slides.py and reverts ruff's changes (f-prefix stripping,
# trailing commas), so keep ruff off this file (mirrors the pre-commit excludes).
extend-exclude = ["slides.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# marimo cell functions receive cross-cell variables as arguments, so their
# names must match the defining variables (e.g. Path, pl).
"name_dataset/download_name_data.py" = ["N803"]
# Migrations contain auto-generated SQL strings that exceed line length.
"records/migrations/*" = ["E501"]
# Seed command uses UPPER_CASE for batch config constants and has long SQL strings.
"records/management/commands/seed_data.py" = ["N806"]
# Models has long SQL strings for match_source annotations.
"records/models.py" = ["E501"]
