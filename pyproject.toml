[project]
name = "talk-fuzzy-name-search"
version = "0.1.0"
description = "Demo: PostgreSQL + Django fuzzy name matching at scale"
requires-python = ">=3.14"
dependencies = [
    "django~=5.2",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "faker>=30",
    "marimo>=0.10",
    "pandas>=3.0.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.9",
    "django-debug-toolbar>=7.0.0",
]

[tool.django]
# For pytest-django auto-discovery
DJANGO_SETTINGS_MODULE = "fuzzy_demo.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fuzzy_demo.settings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# marimo cell functions receive cross-cell variables as arguments, so their
# names must match the defining variables (e.g. Person, MillisecondTimer).
"demo.py" = ["N803"]
